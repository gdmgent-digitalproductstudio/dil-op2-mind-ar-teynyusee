<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Spider-Verse AR - Face Mode</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>

<link rel="stylesheet" href="css/main.css"/>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}

.tap-text{
  position:fixed;
  bottom:35px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 22px;
  font-size:13px;
  letter-spacing:0.5px;

  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,0,60,0.6);
  color:white;
  border-radius:40px;

  backdrop-filter:blur(6px);
  box-shadow:0 0 15px rgba(255,0,60,0.4);

  z-index:999;

  animation: pulseHint 2s infinite alternate ease-in-out;
}

@keyframes pulseHint{
  from{ opacity:0.7; }
  to{ opacity:1; }
}
</style>
</head>

<body>

<!-- PROPER BACK BUTTON -->
<a href="index.html" class="back-btn">← BACK</a>

<div class="tap-text">Tap screen to change mask</div>

<a-scene
  mindar-face="smoothCount:10"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true"
>

  <a-assets>
    <img id="mask1" src="assets/mask1.png">
    <img id="mask3" src="assets/mask3.png">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- FACE CENTER ANCHOR -->
  <a-entity mindar-face-target="anchorIndex:1">

    <a-image
      id="faceMask"
      src="#mask1"
      position="0 0.2 0"
      material="transparent:true; shader:flat; depthTest:false">
    </a-image>

  </a-entity>

</a-scene>

<script src="scripts/face.js"></script>

</body>
</html>
