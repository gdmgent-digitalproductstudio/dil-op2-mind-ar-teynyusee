<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dune AR – Image Tracking</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="css/main.css" />
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<!-- ============================= -->
<!-- TARGET 0 – PAUL -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 0" id="paulTarget">

  <!-- Mist layer -->
  <a-plane 
    id="mist"
    position="0 0 0.08"
    width="1.2"
    height="1.6"
    material="color: #a0c8ff; opacity: 0; transparent: true">
  </a-plane>

  <!-- LEFT EYE -->
  <a-entity position="-0.13 0.07 0.12">

    <a-circle id="leftGlow"
      radius="0.09"
      material="color: #00ccff; opacity: 0; transparent: true; shader: flat"
      animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
    </a-circle>

    <a-circle
      radius="0.04"
      material="color: #00ffff; opacity: 0; transparent: true; shader: flat">
    </a-circle>

    <a-light id="leftLight" type="point" color="#00ccff" intensity="0" distance="1"></a-light>

  </a-entity>

  <!-- RIGHT EYE -->
  <a-entity position="0.13 0.07 0.12">

    <a-circle id="rightGlow"
      radius="0.09"
      material="color: #00ccff; opacity: 0; transparent: true; shader: flat"
      animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
    </a-circle>

    <a-circle
      radius="0.04"
      material="color: #00ffff; opacity: 0; transparent: true; shader: flat">
    </a-circle>

    <a-light id="rightLight" type="point" color="#00ccff" intensity="0" distance="1"></a-light>

  </a-entity>

</a-entity>

<!-- ============================= -->
<!-- TARGET 1 – ENSEMBLE -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 1">

  <a-text
    value="THE PROPHECY AWAKENS"
    color="#e6d5a8"
    align="center"
    position="0 0.4 0.1"
    opacity="0"
    id="prophecyText">
  </a-text>

</a-entity>

<!-- ============================= -->
<!-- TARGET 2 – LOGO -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 2">

  <a-text
    value="FEAR IS THE MIND-KILLER"
    color="#ffffff"
    align="center"
    position="0 0 0.1"
    opacity="0"
    id="fearText">
  </a-text>

</a-entity>

<!-- ============================= -->
<!-- TARGET 3 – SANDWORM -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 3">

  <a-ring
    id="wormRing"
    radius-inner="0.2"
    radius-outer="0.35"
    color="#c8a15a"
    position="0 0 0.1"
    rotation="90 0 0"
    opacity="0">
  </a-ring>

</a-entity>

</a-scene>

<script src="scripts/image.js"></script>

</body>
</html>
