<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<link rel="stylesheet" href="css/main.css" />
</head>

<body>

<a href="index.html" class="back-btn">← Back</a>

<a-scene
mindar-image="imageTargetSrc: assets/targets.mind; maxTrack:1"
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
>

<a-assets>
<img id="paulCutout" src="assets/paul.png">
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" id="paulTarget">

<!-- BOX FRAME -->
<a-box
depth="0.02"
height="1.7"
width="1.2"
position="0 0 0.02"
material="color:#000000; opacity:0.25; transparent:true">
</a-box>

<!-- BACK WALL -->
<a-plane
position="0 0 0.05"
width="1.15"
height="1.65"
material="color:#2a2117">
</a-plane>

<!-- PAUL -->
<a-plane
id="paul"
src="#paulCutout"
position="0 0.02 0.18"
width="1"
height="1.5"
material="transparent:true; alphaTest:0.5">
</a-plane>

<!-- FOREGROUND MIST -->
<a-plane
id="mist"
position="0 0 0.3"
width="1.2"
height="1.8"
material="color:#e6c98d; opacity:0; transparent:true">
</a-plane>

</a-entity>

</a-scene>

<script src="scripts/image.js"></script>

</body>
</html>
