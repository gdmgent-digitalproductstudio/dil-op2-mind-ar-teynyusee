<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dune AR – Scan</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="css/main.css" />
</head>

<body class="scan-page">

<!-- UI OVERLAY -->
<div class="scan-ui">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="scan-text">Scan a Dune visual</div>
</div>

<a-scene
  mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <img id="posterTexture" src="markers/target-0.jpg">
</a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<!-- ============================= -->
<!-- TARGET 0 – PAUL -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 0" id="paulTarget">

  <!-- LAYER 1 -->
  <a-plane id="layer1"
    position="0 0 0.05"
    width="1"
    height="1.5"
    material="src: #posterTexture; transparent: true; opacity: 1">
  </a-plane>

  <!-- LAYER 2 -->
  <a-plane id="layer2"
    position="0 0 0.1"
    width="1"
    height="1.5"
    material="src: #posterTexture; transparent: true; opacity: 0.7">
  </a-plane>

  <!-- LAYER 3 -->
  <a-plane id="layer3"
    position="0 0 0.15"
    width="1"
    height="1.5"
    material="src: #posterTexture; transparent: true; opacity: 0.4">
  </a-plane>

  <!-- MIST -->
  <a-plane id="mist"
    position="0 0 0.2"
    width="1.2"
    height="1.7"
    material="color: #a0c8ff; opacity: 0; transparent: true">
  </a-plane>

  <!-- LEFT EYE -->
  <a-entity position="-0.13 0.07 0.25">
    <a-circle id="leftGlow"
      radius="0.09"
      material="color: #00ccff; opacity: 0; transparent: true; shader: flat"
      animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 800; loop: true">
    </a-circle>
  </a-entity>

  <!-- RIGHT EYE -->
  <a-entity position="0.13 0.07 0.25">
    <a-circle id="rightGlow"
      radius="0.09"
      material="color: #00ccff; opacity: 0; transparent: true; shader: flat"
      animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 800; loop: true">
    </a-circle>
  </a-entity>

  <!-- QUOTE -->
  <a-text id="prophecyQuote"
    value="The sleeper must awaken."
    color="#e6d5a8"
    align="center"
    position="0 -0.6 0.3"
    opacity="0">
  </a-text>

</a-entity>

<!-- ============================= -->
<!-- TARGET 1 – ENSEMBLE -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 1" id="ensembleTarget">
  <a-text id="prophecyText"
    value="THE PROPHECY AWAKENS"
    color="#e6d5a8"
    align="center"
    position="0 0.4 0.1"
    opacity="0">
  </a-text>
</a-entity>

<!-- ============================= -->
<!-- TARGET 2 – LOGO -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 2" id="logoTarget">
  <a-text id="fearText"
    value="FEAR IS THE MIND-KILLER"
    color="#ffffff"
    align="center"
    position="0 0 0.1"
    opacity="0">
  </a-text>
</a-entity>

<!-- ============================= -->
<!-- TARGET 3 – SANDWORM -->
<!-- ============================= -->

<a-entity mindar-image-target="targetIndex: 3" id="wormTarget">
  <a-ring id="wormRing"
    radius-inner="0.2"
    radius-outer="0.35"
    color="#c8a15a"
    position="0 0 0.1"
    rotation="90 0 0"
    opacity="0">
  </a-ring>
</a-entity>

</a-scene>

<script src="scripts/image.js"></script>

</body>
</html>
